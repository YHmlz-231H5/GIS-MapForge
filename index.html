<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content Security Policy — drives Electron's "Insecure CSP" warning.
      We use a build-time switch (%CSP_RULES%) so dev allows vite HMR's eval
      while prod stays tight. Updated by vite.config.ts via html.transform.
    -->
    <meta http-equiv="Content-Security-Policy" content="%CSP_RULES%" />
    <title>MapForge</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!--
      MapLibre CSS + JS come from the npm package via main.tsx (import).
      Do NOT also load vendor/maplibre-gl.js here — dual instances break
      WebGL workers (tiles fetch but only the style background paints).
    -->
    <!-- Suppress known console noise BEFORE the app bundle loads. -->
    <script src="./vendor/suppress-csp-warning.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
